# Requires Docker Compose v2.24.0+ for `env_file.path`/`required` and `develop.watch`.
services:
  postgres:
    image: postgres:18.6-bookworm
    pull_policy: missing
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: aau_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payload -d aau_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.8.2-trixie
    pull_policy: missing
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data

  app-dev:
    build:
      context: .
      target: dev
    image: aau-payload-platform:dev
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: local-docker
      NODE_ENV: development
      DATABASE_URI: postgresql://payload:payload@postgres:5432/aau_platform
      DATABASE_DIRECT_URI: postgresql://payload:payload@postgres:5432/aau_platform
      REDIS_URL: redis://redis:6379
      PAYLOAD_DB_PUSH: 'false'
      PAYLOAD_SERVER_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    volumes:
      - node-modules:/app/node_modules
      - next-cache:/app/.next
      - pnpm-store:/pnpm/store
      - uploads:/app/uploads
    depends_on:
      schema-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - uploads/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml

  schema-init:
    build:
      context: .
      target: dev
    image: aau-payload-platform:dev
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: local-docker
      NODE_ENV: development
      DATABASE_URI: postgresql://payload:payload@postgres:5432/aau_platform
      DATABASE_DIRECT_URI: postgresql://payload:payload@postgres:5432/aau_platform
      REDIS_URL: redis://redis:6379
      PAYLOAD_DB_PUSH: 'true'
      PAYLOAD_SERVER_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    volumes:
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
      - uploads:/app/uploads
    command: ["pnpm", "run", "schema:push"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed:
    profiles: [manual]
    build:
      context: .
      target: dev
    image: aau-payload-platform:dev
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: local-docker
      NODE_ENV: development
      DATABASE_URI: postgresql://payload:payload@postgres:5432/aau_platform
      DATABASE_DIRECT_URI: postgresql://payload:payload@postgres:5432/aau_platform
      REDIS_URL: redis://redis:6379
      PAYLOAD_DB_PUSH: 'false'
      PAYLOAD_SERVER_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    volumes:
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
      - uploads:/app/uploads
    command: ["pnpm", "seed"]
    depends_on:
      schema-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  db-reset:
    profiles: [manual]
    build:
      context: .
      target: dev
    image: aau-payload-platform:dev
    env_file:
      - path: .env.docker
        required: false
    environment:
      APP_ENV: local-docker
      NODE_ENV: development
      DATABASE_URI: postgresql://payload:payload@postgres:5432/aau_platform
      DATABASE_DIRECT_URI: postgresql://payload:payload@postgres:5432/aau_platform
      REDIS_URL: redis://redis:6379
      PAYLOAD_DB_PUSH: 'false'
      RESET_LOCAL_DB: 'true'
      RESET_LOCAL_DB_CONFIRM: aau_platform
    volumes:
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
    command: ["sh", "-c", "pnpm db:reset:local && PAYLOAD_DB_PUSH=true pnpm schema:push"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  node-modules:
  next-cache:
  pnpm-store:
  uploads:
