# CI SOURCE-BUILD REGRESSION CONTRACT — NOT the VPS runtime.
#
# This file exists to keep the source-built path working: build from source,
# run the Payload CLI migration, run the broad canonical Seed, serve. The VPS
# runs `deploy/docker-compose.vps.yml` with a prebuilt, source-free image and
# shares none of this.
#
# Two names to keep straight, because they are different operations:
#
#   minimal identity bootstrap  create missing canonical Roles and the
#                               configured Super Admin, nothing else. Runs
#                               automatically at application start, in both
#                               environments. Never rewrites content.
#
#   canonical Seed              broad content: taxonomy, departments, programs,
#                               academic and editorial content, navigation,
#                               globals. NEVER runs at startup anywhere. On the
#                               VPS it is an explicit one-shot operation from a
#                               source-free bundled artifact.
#
# The service below runs the SECOND one, and is named accordingly.
x-runtime-environment: &runtime-environment
  NODE_ENV: production
  # This stack is exercised over loopback HTTP in CI, while the production
  # runtime requires a real public HTTPS origin and otherwise fails closed
  # (see src/utilities/getURL.ts). The opt-out defaults to OFF and is enabled
  # explicitly by the release-gate `docker` job; the VPS profile never sets it.
  PAYLOAD_ALLOW_INSECURE_ORIGIN: ${PAYLOAD_ALLOW_INSECURE_ORIGIN:-false}
  DATABASE_URI: ${DATABASE_URI:?DATABASE_URI is required}
  DATABASE_DIRECT_URI: ${DATABASE_DIRECT_URI:?DATABASE_DIRECT_URI is required}
  REDIS_URL: redis://redis-prod:6379
  PAYLOAD_DB_PUSH: 'false'
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
  PAYLOAD_SERVER_ORIGIN: ${PAYLOAD_SERVER_ORIGIN:-http://localhost:3000}
  NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
  S3_ENABLED: ${S3_ENABLED:-false}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_PREFIX: ${S3_PREFIX:-media}
  S3_PRIVATE_PREFIX: ${S3_PRIVATE_PREFIX:-private-media}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

services:
  postgres-prod:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: aau_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: payload
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d aau_platform']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-prod-data:/var/lib/postgresql

  redis-prod:
    image: redis:8.8.2-trixie
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-prod-data:/data

  migrate-prod:
    build:
      context: .
      target: operations
    image: aau-payload-platform:operations
    restart: 'no'
    environment: *runtime-environment
    command: ['pnpm', 'payload', 'migrate']
    depends_on:
      postgres-prod:
        condition: service_healthy

  # ── Named for what it actually does ──────────────────────────────────────
  # This service runs `pnpm seed` — the BROAD canonical Seed: taxonomy,
  # departments, programs, academic and editorial content, navigation and
  # globals. It was previously called `seed-bootstrap-prod`, which read as the
  # minimal identity bootstrap the VPS runtime performs. Those are different
  # operations with different blast radii, and blurring them in the name of a
  # service is how someone eventually runs the wrong one against production.
  #
  # The VPS runtime never uses this service, this image, or this file. Its
  # canonical Seed is an explicit one-shot operation run from a source-free
  # bundled artifact (deploy/scripts/seed.sh).
  canonical-seed-source-build:
    image: aau-payload-platform:operations
    restart: 'no'
    profiles: ['canonical-seed']
    environment:
      <<: *runtime-environment
      # The canonical Seed is a STAGING-ONLY operation, and this service is the
      # source-build analogue of `deploy/scripts/seed.sh`, whose entrypoint
      # (`deploy/scripts/seed-entrypoint.sh`) hard-binds `AAU_ENV=staging`
      # before it will invoke the Seed at all. Declare the same identity here.
      #
      # Nothing else in this file sets AAU_ENV, and that is deliberate: every
      # other service stays production-assumed, so the drill that runs after
      # this one still proves a PRODUCTION runtime never reseeds on redeploy.
      # Hoisting this line into `*runtime-environment` would make that proof
      # vacuous. `src/seed/run-seed.ts` refuses a broad Seed in production, so
      # without this the Seed step fails closed — which is the guard working,
      # not a defect to route around by relabelling the whole stack.
      AAU_ENV: staging
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    command: ['pnpm', 'seed']
    volumes:
      - uploads-prod:/app/uploads
    depends_on:
      migrate-prod:
        condition: service_completed_successfully
      postgres-prod:
        condition: service_healthy

  app-prod:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    image: aau-payload-platform:production
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment: *runtime-environment
    volumes:
      - uploads-prod:/app/uploads
    depends_on:
      migrate-prod:
        condition: service_completed_successfully
      postgres-prod:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  postgres-prod-data:
  redis-prod-data:
  uploads-prod:
